name: CI — syntax & template render

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          # Minimum to render templates and parse all code
          pip install Flask Pillow Jinja2 numpy

      - name: Python syntax check
        run: |
          for f in $(find . -name '*.py' -not -path './.venv/*' -not -path './venv/*'); do
            python -c "import ast; ast.parse(open('$f', encoding='utf-8').read())"
            echo "  ✓ $f"
          done

      - name: Notebook JSON validity
        run: |
          for nb in notebooks/*.ipynb; do
            python -c "import json; json.load(open('$nb', encoding='utf-8'))"
            echo "  ✓ $nb"
          done

      - name: Jinja template render check
        working-directory: gui
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, '.')
          from species_data import SPECIES_DETAILS
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('templates'))

          mock_info = {
              'aquila_audax': {
                  'common_name': 'Wedge-tailed Eagle',
                  'scientific_name': 'Aquila audax',
                  'epbc_status': 'Not listed',
                  'habitat': 'open woodland', 'length_cm': '85-105',
                  'wingspan_cm': '182-232', 'diagnostic': 'wedge tail',
                  'auslan_sign': 'inverted V',
                  'auslan_video': 'aquila_audax.svg',
                  'color': '#2C3E50',
              },
          }
          mock_metrics = {
              'aquila_audax': {'f1':0.7,'precision':0.7,'recall':0.7,
                                'support':50,'train_count':600},
          }

          for name in ['index.html', 'species.html', 'data.html']:
              env.get_template(name).render(
                  species_info=mock_info,
                  species_metrics=mock_metrics,
                  species_details=SPECIES_DETAILS,
                  total_observations=0, observations_by_species={},
                  feedback_count=0, recent_observations=[],
              )
              print(f'  ✓ rendered {name}')
          PY

      - name: CITATION.cff validity
        run: |
          python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"
          echo "  ✓ CITATION.cff parses"
