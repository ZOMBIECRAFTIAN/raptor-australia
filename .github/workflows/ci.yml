name: CI — syntax & template render

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          # Minimum to render templates and parse Python — no
          # torch/torchvision needed for CI (those run on the user
          # machine when training/inference is required).
          pip install Flask Pillow Jinja2 numpy PyYAML

      - name: Python syntax check
        run: |
          for f in $(find . -name '*.py' -not -path './.venv/*' -not -path './venv/*'); do
            python -c "import ast; ast.parse(open('$f', encoding='utf-8').read())"
            echo "  ✓ $f"
          done

      - name: Notebook JSON validity
        run: |
          for nb in notebooks/*.ipynb; do
            python -c "import json; json.load(open('$nb', encoding='utf-8'))"
            echo "  ✓ $nb"
          done

      - name: Jinja template render check
        working-directory: gui
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')

          # Project modules (no torch deps inside these — safe in CI).
          from species_data           import SPECIES_DETAILS
          from species_data_i18n      import get_species_data
          from i18n                   import (load_translations, t,
                                              get_locale, get_languages,
                                              LANGUAGES)

          from flask import Flask
          load_translations()

          app = Flask(__name__, template_folder='templates')
          app.jinja_env.globals.update(
              t=t, get_locale=get_locale,
              get_languages=get_languages, LANGUAGES=LANGUAGES,
          )

          # Mock data covering every variable any template touches.
          mock_info = {
              'aquila_audax': {
                  'common_name': 'Wedge-tailed Eagle',
                  'scientific_name': 'Aquila audax',
                  'epbc_status': 'Not listed (A. a. fleayi: Endangered)',
                  'habitat': 'open woodland', 'length_cm': '85-105',
                  'wingspan_cm': '182-232',
                  'diagnostic': 'wedge tail',
                  'auslan_sign': 'inverted V',
                  'auslan_video': 'aquila_audax.svg',
                  'color': '#2C3E50',
                  'distribution': 'continental AU',
                  'diet': 'mammals',
                  'behavior': 'soaring',
                  'behaviour': 'soaring',
                  'migration': 'non-migratory',
                  'nesting': 'tall trees',
                  'breeding_months': 'Apr-Oct',
                  'best_months': 'year-round',
                  'did_you_know': 'largest raptor',
              },
          }
          mock_metrics = {
              'aquila_audax': {'f1': 0.7, 'precision': 0.7,
                                'recall': 0.7,
                                'support': 50, 'train_count': 600},
          }
          mock_videos = {
              'aquila_audax': {'exists': False,
                                'filename': 'aquila_audax.mp4',
                                'size_mb': 0},
          }

          common_kwargs = dict(
              species_info=mock_info,
              species_metrics=mock_metrics,
              species_details=mock_info,
              behavior_videos=mock_videos,
              total_observations=0,
              observations_by_species={},
              feedback_count=0,
              recent_observations=[],
          )

          for name in ['index.html', 'species.html', 'data.html']:
              # request context required because templates use
              # request.path inside the language picker.
              with app.test_request_context(f'/?_render_test={name}'):
                  out = app.jinja_env.get_template(name).render(
                      **common_kwargs)
                  assert len(out) > 500, f'{name} rendered too short'
                  print(f'  ✓ rendered {name} ({len(out)} chars)')
          PY

      - name: CITATION.cff validity
        run: |
          python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"
          echo "  ✓ CITATION.cff parses"
