name: CI - masters release checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RAPTOR_LIGHTWEIGHT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install Flask==3.1.3 Pillow==12.2.0 Jinja2==3.1.6 numpy==2.4.6 PyYAML==6.0.3 pytest==9.1.0 python-dotenv==1.2.2

      - name: Run project healthcheck
        run: python notebooks/healthcheck.py --verbose