<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="AUSLAN sign motion — White-bellied Sea-Eagle">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1F618D" />
      <stop offset="100%" stop-color="#1F618DDD" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="360" fill="url(#bg)" />

  <!-- Header -->
  <text x="240" y="40" text-anchor="middle" fill="white"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="700">
    White-bellied Sea-Eagle
  </text>
  <text x="240" y="62" text-anchor="middle" fill="rgba(255,255,255,0.78)"
        font-family="Segoe UI, Arial, sans-serif"
        font-style="italic" font-size="13">
    Haliaeetus leucogaster
  </text>

  <!-- Motion guideline -->
  <path d="M 60,210 Q 240,180 420,210" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M 60,240 Q 240,260 420,240" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Animated hand marker(s) -->
  <g>
    <circle r="14" fill="white" />
    <text y="6" text-anchor="middle" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="22">🤟</text>
    <animateMotion dur="3.6s" repeatCount="indefinite" begin="0s" path="M 60,210 Q 240,180 420,210" />
  </g>
  <g>
    <circle r="14" fill="white" />
    <text y="6" text-anchor="middle" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="22">🤟</text>
    <animateMotion dur="3.6s" repeatCount="indefinite" begin="0.15s" path="M 60,240 Q 240,260 420,240" />
  </g>

  <!-- Caption -->
  <rect x="0" y="312" width="480" height="48"
        fill="rgba(0,0,0,0.32)" />
  <text x="240" y="335" text-anchor="middle" fill="white"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13">
    Both flat hands, wide steady glide above ocean surface
  </text>
  <text x="240" y="352" text-anchor="middle"
        fill="rgba(255,255,255,0.65)"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="10" font-style="italic">
    PROVISIONAL ILLUSTRATION — pending Deaf community validation
  </text>
</svg>
