<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="AUSLAN sign motion — Brahminy Kite">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7B241C" />
      <stop offset="100%" stop-color="#7B241CDD" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="360" fill="url(#bg)" />

  <!-- Header -->
  <text x="240" y="40" text-anchor="middle" fill="white"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="700">
    Brahminy Kite
  </text>
  <text x="240" y="62" text-anchor="middle" fill="rgba(255,255,255,0.78)"
        font-family="Segoe UI, Arial, sans-serif"
        font-style="italic" font-size="13">
    Haliastur indus
  </text>

  <!-- Motion guideline -->
  <path d="M 80,140 Q 240,40 400,140 Q 240,260 80,140" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Animated hand marker(s) -->
  <g>
    <circle r="14" fill="white" />
    <text y="6" text-anchor="middle" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="22">🤟</text>
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0s" path="M 80,140 Q 240,40 400,140 Q 240,260 80,140" />
  </g>

  <!-- Caption -->
  <rect x="0" y="312" width="480" height="48"
        fill="rgba(0,0,0,0.32)" />
  <text x="240" y="335" text-anchor="middle" fill="white"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="13">
    Curved hand, smooth arc with brief pause (coastal scavenging swoop)
  </text>
  <text x="240" y="352" text-anchor="middle"
        fill="rgba(255,255,255,0.65)"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="10" font-style="italic">
    PROVISIONAL ILLUSTRATION — pending Deaf community validation
  </text>
</svg>
