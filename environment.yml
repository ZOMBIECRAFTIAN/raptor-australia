# Australian Raptor CNN + AUSLAN - Conda environment
# Modern compatibility baseline for the direct project setup.
# Tested locally with Python 3.13.9 and the package versions in requirements.txt.
#
# Setup:
#   conda env create -f environment.yml
#   conda activate raptor_env
#
# Pip-only local setup on E: is also supported:
#   python -m venv .venv-modern
#   .\.venv-modern\Scripts\activate
#   python -m pip install --upgrade pip setuptools wheel
#   pip install -r requirements.txt

name: raptor_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - Flask==3.1.3
      - python-dotenv==1.2.2
      - torch==2.12.0+cu130
      - torchvision==0.27.0+cu130
      - timm==1.0.27
      - Pillow==12.2.0
      - opencv-python==4.13.0.92
      - numpy==2.4.6
      - ultralytics==8.4.67
      - jupyter==1.1.1
      - ipykernel==7.3.0
      - matplotlib==3.11.0
      - seaborn==0.13.2
      - scikit-learn==1.9.0
      - scipy==1.17.1
      - pandas==3.0.3
      - tqdm==4.68.2
      - pyyaml==6.0.3
      - python-docx==1.2.0
      - pytest==9.1.0
      - grad-cam==1.5.5